<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Aulos, a modern music player, in your browser." />
    <meta name="color-scheme" content="dark light" />
    <title>Aulos</title>
    <link data-trunk rel="icon" type="image/png" href="assets/icon-256.png" />
    <link data-trunk rel="rust" data-bin="aulos" data-wasm-opt="z" data-wasm-opt-params="--all-features" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #121214;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f6f6f8;
        }
        #loading {
          color: #444;
        }
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 16px system-ui, sans-serif;
        color: #bbb;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="aulos_canvas"></canvas>
    <div id="loading">Loading Aulos…</div>
  </body>
</html>
