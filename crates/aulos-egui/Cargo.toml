[package]
name = "aulos-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental egui front end for the Aulos backend (aulos-core)"
repository.workspace = true

# Proves the backend/UI split: depends on `aulos-core` only, never on the
# `aulos` COSMIC crate or libcosmic.
[dependencies]
aulos-core.workspace = true
eframe = "0.36.2"
egui_extras = "0.36.2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
