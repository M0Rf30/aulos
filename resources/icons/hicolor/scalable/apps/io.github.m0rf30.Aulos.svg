<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Aulos app icon: the "reed mark" from the UI v1 design — two slanted
       reeds, a nod to the aulos double pipe. Tile in the dark ink of the UI,
       tall reed in the signature coral, short reed in paper white. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26241F"/>
      <stop offset="1" stop-color="#151412"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g transform="translate(56 96) skewX(-14) translate(-64 -96)">
    <rect x="45" y="30" width="15" height="66" rx="7.5" fill="#E07A5F"/>
    <rect x="68" y="48" width="15" height="48" rx="7.5" fill="#F4F1EC"/>
  </g>
</svg>
