[package]
name = "aulos"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A modern music player for the COSMIC desktop"
repository = "https://github.com/M0Rf30/aulos"

[dependencies]
# COSMIC / UI framework
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "03d7dcb", features = [
    "about",
    "tokio",
    "wayland",
    "winit",
    "wgpu",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Audio playback engine — direct symphonia (DSD-capable fork) + cpal, no
# rodio. See the removed patch-comment history: rodio's own transitive
# symphonia dep (crates.io 0.5.5) cannot be patched to this fork in place
# because the fork tracks the post-0.5.5 `symphonia-core` API redesign
# (codecs::Decoder split into codecs::audio::AudioDecoder, `probe` moved
# out of core) that rodio 0.22 doesn't compile against. Depending on the
# fork directly (not via `[patch.crates-io]`) sidesteps that conflict
# entirely, matching the working approach in the sibling `rmpd` project.
symphonia = { git = "https://github.com/M0Rf30/Symphonia.git", rev = "d787e636970492cec3eecdac5b666bb27fedf4bc", features = [
    "all",
    "dsd",
] }
cpal = "0.18"
rubato = "5.0"
audioadapter-buffers = "5.2"
# Internal-only locks in the playback engine (e.g. the gapless/crossfade
# look-ahead slot) that are always locked and immediately unwrapped, never
# held across an `.await` — parking_lot's non-poisoning guards are the
# better fit there. Not used for the visualizer's `PcmBuffer` mutex, whose
# type is fixed by `Player`/`App`'s existing `std::sync::Mutex` signature.
parking_lot = "0.12"

# MPD protocol client. Pinned to the `aulos` branch of the M0Rf30 fork, which
# merges the fixes submitted upstream (elomatreb/mpd_client#26-#33): argument
# and filter escaping, every idle `changed:` line, MPD 0.24 `status`
# (`consume oneshot`, `updating_db`), `stats` without a DB, `album_art`
# returning `None`. Switch back to crates.io once they're released.
mpd_client = { git = "https://github.com/M0Rf30/mpd_client.git", rev = "49b12544278f6f149bbde8d74bf8d7d907653803" }

# OpenSubsonic/Subsonic API client
opensubsonic = { git = "https://github.com/M0Rf30/opensubsonic-rs.git", rev = "a43fb76058d4457c6d7d9b824fcdd90025652864" }

# Database for music library
rusqlite = { version = "0.40", features = ["bundled"] }

# Lyrics fetching and AutoEQ profile fetching
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
icy-metadata = "0.6"
# Held at 2.x: feed-rs 3.0 drops an item's iTunes media object unless it
# also carries an itunes title/summary, losing `<itunes:duration>` for
# many real feeds (and failing podcast::tests). Revisit on 3.x updates.
feed-rs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image handling for cover art
image = "0.25"

# Internationalization
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

# File system watching for library updates
notify = "8"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# XDG Desktop Portal (directory picker, suspend/idle inhibit)
ashpd = { version = "0.13", features = ["file_chooser", "inhibit"] }

# Credential storage (system keyring)
# keyring 4 is a thin facade re-exporting keyring-core; on Linux it only wires up
# the D-Bus secret service backend, not the kernel keyutils one. We depend on
# keyring-core directly and pick a default store ourselves (see src/credentials.rs),
# preferring kernel keyutils and falling back to the D-Bus secret service, matching
# legacy keyring v3 behavior.
keyring-core = "1"
linux-keyutils-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

# MPRIS2 D-Bus media player interface (media keys, shell/panel integration).
# Rides the zbus 5.x already pulled in by ashpd and the secret-service keyring
# store, so this adds no new transitive D-Bus stack.
mpris-server = { version = "0.10", features = ["tokio"] }

# Direct zbus dependency for main.rs's cold-start handoff to an
# already-running instance (name-owner check + `OpenUri`/`Raise` over
# D-Bus, before the app's own event loop -- and mpris-server's own
# zbus/tokio integration -- starts). Pinned to the same major version
# already resolved transitively (5.19.0, via ashpd/mpris-server/the
# secret-service keyring store), with only the `tokio` feature so it
# doesn't pull in a second (async-io) executor.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Misc
open = "5"
dirs = "7"
walkdir = "2"
chrono = "0.4"
urlencoding = "2"
md5 = "0.8"
thiserror = "2"
regex = "1"

# Local file conversion / transcoding / CUE ripping. Pure Rust — no C
# bindings/-sys crates here. Lossless formats this converter can't
# encode without a C dependency (WAV is via `hound` below; AIFF is
# hand-written, no crate needed). Lossy formats (MP3/AAC/Opus/Ogg
# Vorbis/ALAC) have no usable pure-Rust encoder as of this writing (see
# src/convert/encoder.rs's module docs for the crates.io candidates
# rejected and why) and fall back to shelling out to the system
# `ffmpeg` binary at runtime instead — no crate/build dependency added
# for that, so CD-drive ripping (which does need C bindings) is still
# the one thing out of scope here.
flacenc = "0.5"
hound = "3.5"

# Optional: tokio-console support for runtime introspection
console-subscriber = { version = "0.5", optional = true }

# Optional: ProjectM visualizer (behind `visualizer` feature flag)
projectm = { version = "3.1", optional = true, default-features = false, features = ["static"] }
glutin = { version = "0.32", optional = true }
gl = { version = "0.14", optional = true }
# MPD visualizer audio: capture MPD's own PipeWire playback stream (aulos only
# remote-controls MPD, so no PCM passes through the in-app engine tap).
pipewire = { version = "0.10", optional = true }

[features]
default = []
tokio-console = ["dep:console-subscriber"]
visualizer = ["dep:projectm", "dep:glutin", "dep:gl", "dep:pipewire"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "db_grouping"
harness = false

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# projectm 3.1.2 casts C strings to `*const i8`, which does not compile where
# `c_char` is `u8` (aarch64 Linux). Fork with the fix, pending upstream
# https://github.com/projectM-visualizer/projectm-rs/pull/22 — drop once released.
[patch.crates-io]
projectm = { git = "https://github.com/M0Rf30/projectm-rs.git", rev = "d31e0389d388eff8557132958d1e9ba57d8671ea" }

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
