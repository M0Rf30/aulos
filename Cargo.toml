[workspace]
members = [".", "crates/aulos-core", "crates/aulos-egui"]
# Plain `cargo test`/`clippy`/`build` at the root cover the backend crate too.
# `crates/aulos-egui` (an experimental egui front end) is a member but is
# deliberately not a default member: build it with `-p aulos-egui`.
default-members = [".", "crates/aulos-core"]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/M0Rf30/aulos"

# Dependencies used by both the backend (`aulos-core`) and the UI (`aulos`),
# pinned once here.
[workspace.dependencies]
aulos-core = { path = "crates/aulos-core" }

# COSMIC: the UI toolkit, and its standalone config store (used by the
# backend without any iced/UI dependency). Keep both on the same rev.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "a6ac45c" }
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git", rev = "a6ac45c", default-features = false }

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# MPD protocol client. Pinned to the `aulos` branch of the M0Rf30 fork, which
# merges the fixes submitted upstream (elomatreb/mpd_client#26-#33): argument
# and filter escaping, every idle `changed:` line, MPD 0.24 `status`
# (`consume oneshot`, `updating_db`), `stats` without a DB, `album_art`
# returning `None`. Switch back to crates.io once they're released.
mpd_client = { git = "https://github.com/M0Rf30/mpd_client.git", rev = "49b12544278f6f149bbde8d74bf8d7d907653803" }

# OpenSubsonic/Subsonic API client
opensubsonic = { git = "https://github.com/M0Rf30/opensubsonic-rs.git", rev = "a43fb76058d4457c6d7d9b824fcdd90025652864" }

reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
image = "0.25"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
tracing = "0.1"

# XDG Desktop Portal (directory picker, suspend/idle inhibit)
ashpd = { version = "0.13", features = ["file_chooser", "inhibit"] }

# zbus 5.x, the same major already resolved transitively (via ashpd,
# mpris-server and the secret-service keyring store), with only the `tokio`
# feature so it doesn't pull in a second (async-io) executor.
zbus = { version = "5", default-features = false, features = ["tokio"] }

open = "5"
dirs = "7"
walkdir = "2"
urlencoding = "2"

[package]
name = "aulos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A modern music player for the COSMIC desktop"
repository.workspace = true

[dependencies]
# Backend: library, playback, providers, online services, tagging, config.
# Everything UI-independent lives there; this crate is the COSMIC UI.
aulos-core.workspace = true

# COSMIC / UI framework
libcosmic = { workspace = true, features = [
    "about",
    "tokio",
    "wayland",
    "winit",
    "wgpu",
] }

tokio.workspace = true
futures-util.workspace = true
mpd_client.workspace = true
opensubsonic.workspace = true
reqwest.workspace = true
image.workspace = true
# `aulos_core::fl!` expands to `i18n_embed_fl::fl!`, which must be resolvable
# from (and checks message ids against) the calling crate.
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ashpd.workspace = true
# main.rs's cold-start handoff to an already-running instance (name-owner
# check + `OpenUri`/`Raise` over D-Bus, before the app's own event loop --
# and mpris-server's own zbus/tokio integration -- starts).
zbus.workspace = true
open.workspace = true
dirs.workspace = true
walkdir.workspace = true
urlencoding.workspace = true
chrono = "0.4"

# Optional: tokio-console support for runtime introspection
console-subscriber = { version = "0.5", optional = true }

# Optional: lactea MilkDrop visualizer (behind `visualizer` feature flag). It
# renders on its own wgpu 30 device (iced/libcosmic is on a different wgpu
# major), so frames are read back and uploaded into the UI's texture.
lactea = { version = "0.1.2", optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }

[features]
default = []
tokio-console = ["dep:console-subscriber"]
visualizer = ["aulos-core/visualizer", "dep:lactea", "dep:wgpu", "dep:pollster"]

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
