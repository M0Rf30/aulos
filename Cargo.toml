[workspace]
members = ["crates/aulos-core", "crates/aulos"]
# Plain `cargo test`/`clippy`/`build` at the root cover both crates.
default-members = ["crates/aulos-core", "crates/aulos"]
resolver = "3"

[workspace.package]
version = "0.14.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/M0Rf30/aulos"

# Dependencies used by both the backend (`aulos-core`) and the app (`aulos`),
# pinned once here.
[workspace.dependencies]
aulos-core = { path = "crates/aulos-core" }

# Features are chosen per target by each crate: the native build uses "full",
# the browser build only the runtime-free parts (`sync`, `macros`); there are
# no threads, sockets or timers behind tokio on wasm32.
tokio = { version = "1", default-features = false }

# MPD protocol client. Pinned to the `aulos` branch of the M0Rf30 fork, which
# merges the fixes submitted upstream (elomatreb/mpd_client#26-#33): argument
# and filter escaping, every idle `changed:` line, MPD 0.24 `status`
# (`consume oneshot`, `updating_db`), `stats` without a DB, `album_art`
# returning `None`. Switch back to crates.io once they're released.
mpd_client = { git = "https://github.com/M0Rf30/mpd_client.git", rev = "49b12544278f6f149bbde8d74bf8d7d907653803" }

# OpenSubsonic/Subsonic API client
opensubsonic = { git = "https://github.com/M0Rf30/opensubsonic-rs.git", tag = "v0.6.1" }

# `blocking` and the rustls TLS stack are native only (core's manifest adds
# them): in the browser reqwest is a thin layer over `fetch`.
reqwest = { version = "0.13", features = ["json"], default-features = false }
image = "0.25"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
tracing = "0.1"

# Linux only: XDG Desktop Portal suspend/idle inhibit (file dialogs go through
# `rfd`, which talks to the same portal).
ashpd = { version = "0.13", features = ["inhibit"] }

# Linux only. zbus 5.x, the same major already resolved transitively (via
# ashpd, mpris-server and the secret-service keyring store), with only the
# `tokio` feature so it doesn't pull in a second (async-io) executor.
zbus = { version = "5", default-features = false, features = ["tokio"] }

open = "5"
dirs = "7"
walkdir = "2"
urlencoding = "2"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
