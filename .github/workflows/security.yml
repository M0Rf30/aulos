name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full history for better advisory detection
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        # Ignores mirror deny.toml: transitive, unmaintained crates we do not
        # control.
        #   RUSTSEC-2024-0436 paste (unmaintained)
        #   RUSTSEC-2026-0370 zvariant (unmaintained)
        #   RUSTSEC-2026-0371 zbus_names (unmaintained)
        #   RUSTSEC-2026-0372 zvariant_derive (unmaintained)
        #   RUSTSEC-2026-0374 basic-toml (unmaintained, build-time via i18n-config)
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
          --ignore RUSTSEC-2026-0374

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
