name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Same feature set as release binaries (see release.yml).
  FEATURES: visualizer
  # Native libraries needed by eframe/winit (xkbcommon, Wayland; X11/GL/Vulkan
  # are dlopen()ed at runtime), cpal (ALSA) and the `visualizer` feature (MPD
  # capture: PipeWire/SPA; the lactea engine is pure Rust on wgpu and needs no
  # extra dev packages). Verified on Ubuntu 24.04.
  APT_DEPS: >-
    pkg-config
    libxkbcommon-dev
    libwayland-dev
    libasound2-dev
    libpipewire-0.3-dev
    libspa-0.2-dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the x86_64 macOS runner (macos-13 is retired).
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_DEPS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run clippy
        shell: bash
        run: cargo clippy --all-targets --locked --features "$FEATURES" -- -D warnings

      # `aulos-core` is the UI-independent backend: it must build on its own
      # (no features unified in from the app crate) and never pull in a UI
      # toolkit.
      - name: Check backend stays UI-free
        if: runner.os == 'Linux'
        run: |
          cargo check -p aulos-core --all-targets --locked --features "$FEATURES"
          if cargo tree -p aulos-core -e normal --prefix none --locked --features "$FEATURES" \
            | grep -E '^(winit|egui[a-z_]*|eframe) '; then
            echo "::error::aulos-core must not depend on a UI toolkit"
            exit 1
          fi

  # The egui app also builds for the browser (see pages.yml). Native-only
  # dependencies are gated by target, so no system packages are needed here.
  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          cache-on-failure: true

      - name: Check
        run: cargo check --target wasm32-unknown-unknown -p aulos --locked

      - name: Run clippy
        run: cargo clippy --target wasm32-unknown-unknown -p aulos --locked -- -D warnings

  # The egui app also builds as an Android APK (NativeActivity, `cargo apk`).
  # Ubuntu runners ship the SDK and NDK; cargo-apk signs with the debug key.
  android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true

      - name: Clippy
        run: |
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          cargo clippy --target aarch64-linux-android -p aulos --lib --locked -- -D warnings

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null || true
          cargo apk build -p aulos --lib --locked

      - uses: actions/upload-artifact@v7
        with:
          name: aulos-android-debug
          path: target/debug/apk/aulos.apk

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_DEPS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        shell: bash
        run: cargo test --locked --features "$FEATURES"

  build:
    name: Build (${{ matrix.target }})
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # Native aarch64 runner: no cross-compilation toolchain needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: aulos.exe
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_DEPS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        shell: bash
        run: cargo build --release --locked --features "$FEATURES"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aulos-${{ matrix.target }}
          path: target/release/${{ matrix.exe || 'aulos' }}
          if-no-files-found: error
