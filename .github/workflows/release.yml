name: Release

# Builds Linux, Windows and macOS release archives and publishes them as a
# GitHub Release.
#
# Trigger: a bare semver tag (e.g. `0.1.0`, matching the Cargo.toml version), or
# a manual run. A manual run builds and packages everything (as a dry run) but
# does not publish, since there is no tag to attach a Release to; the tarballs
# are kept as workflow artifacts.
#
# Targets: Linux x86_64/aarch64 (.tar.gz), Windows x86_64 MSVC (.zip) and macOS
# aarch64/x86_64 (.tar.gz) and Android (one universal .apk, when the signing
# secrets are set). Linux is glibc only (a GUI app that dlopen()s
# wayland/GPU libraries cannot be statically linked with musl). All builds are
# native, there is no cross-compilation.
#
# Features: release binaries are built with `--features visualizer`, so the
# lactea visualizer ships enabled. lactea is pure Rust on wgpu (needs a Vulkan
# or GL driver at runtime on Linux, Direct3D 12/Vulkan on Windows, Metal on
# macOS). MPD audio capture goes through PipeWire and exists on Linux only, so
# only the Linux binary links libpipewire-0.3.
# `tokio-console` is deliberately left out: it replaces normal logging with a
# debug server on port 6669 and is only meant for local debugging.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FEATURES: visualizer
  # Native libraries needed by eframe/winit (xkbcommon, Wayland; X11/GL/Vulkan
  # are dlopen()ed at runtime), cpal (ALSA) and the `visualizer` feature (MPD
  # capture: PipeWire/SPA; the lactea engine is pure Rust on wgpu and needs no
  # extra dev packages). Verified on Ubuntu 24.04.
  APT_DEPS: >-
    pkg-config
    libxkbcommon-dev
    libwayland-dev
    libasound2-dev
    libpipewire-0.3-dev
    libspa-0.2-dev

# Two concurrent releases would race onto the same GitHub Release's asset list.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; only the `release` job widens to `contents:
# write`.
permissions:
  contents: read

jobs:
  # The same gate ci.yml enforces. Duplicated deliberately: a tag can point at
  # any commit, including one that never passed CI.
  test:
    name: Build, test, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_DEPS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Resolved once here and shared via job output so `build` and `release`
      # agree on it.
      - name: Resolve crate version
        id: version
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "aulos") | .version')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Refuse to release a version the tag does not name (e.g. tagging 0.2.0
      # while Cargo.toml still says 0.1.0).
      - name: Tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml ${VERSION}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${VERSION}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked --features "$FEATURES" -- -D warnings

      - name: Run tests
        run: cargo test --locked --features "$FEATURES"

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # Native aarch64 runner: a same-arch build, no cross toolchain or
          # cross pkg-config.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # macos-15-intel is the x86_64 macOS runner (macos-13 is retired).
          - target: x86_64-apple-darwin
            os: macos-15-intel
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_DEPS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release
        shell: bash
        run: cargo build --release --locked --features "$FEATURES"

      # The tarball unpacks to aulos-<version>-<target>/ with the binary next to
      # the justfile, so `sudo just install` works from inside the extracted
      # directory.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="aulos-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp target/release/aulos LICENSE README.md justfile "dist/${name}/"
          cp -r resources "dist/${name}/resources"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist
          echo "TARBALL=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="aulos-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp target/release/aulos LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist
          echo "TARBALL=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="aulos-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp target/release/aulos.exe LICENSE README.md "dist/${name}/"
          (cd dist && 7z a -tzip "${name}.zip" "${name}")
          (cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256")
          ls -l dist
          echo "TARBALL=dist/${name}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aulos-${{ matrix.target }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          if-no-files-found: error

  # One universal, release-signed APK (arm64-v8a + x86_64) so Obtainium and
  # other updaters see a single asset and can update silently. The signing key
  # must never change between releases, or Android refuses the update: it comes
  # from the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets, and
  # the job is skipped (never debug-signed) while they are not set.
  android:
    name: Build (Android)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.test.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Check signing key
        id: key
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$CARGO_APK_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD not set: no Android APK in this release"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Rust cache
        if: steps.key.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-apk
        if: steps.key.outputs.present == 'true'
        run: cargo install cargo-apk --locked

      - name: Build APK
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null || true
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aulos.keystore"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/aulos.keystore"
          cargo apk build --release -p aulos --lib --locked --features visualizer
          mkdir -p dist
          # Named after the tag so Obtainium's version detection and the other
          # assets line up.
          cp target/release/apk/aulos.apk "dist/aulos-${VERSION}-android.apk"
          (cd dist && sha256sum "aulos-${VERSION}-android.apk" > "aulos-${VERSION}-android.apk.sha256")
          rm "$RUNNER_TEMP/aulos.keystore"

      - name: Upload artifact
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aulos-android
          path: dist/aulos-${{ needs.test.outputs.version }}-android.apk*
          if-no-files-found: error

  release:
    name: Create Release
    # `workflow_dispatch` has no tag to attach a Release to; tarballs stay as
    # artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
          else
            range="$tag"
          fi
          base="aulos-${VERSION}"
          x86="${base}-x86_64-unknown-linux-gnu"
          arm="${base}-aarch64-unknown-linux-gnu"
          win="${base}-x86_64-pc-windows-msvc"
          macarm="${base}-aarch64-apple-darwin"
          macx86="${base}-x86_64-apple-darwin"
          {
            echo "## What's Changed"
            echo
            git log "$range" --pretty=format:"- %s (%h)" --no-merges
            echo
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Architecture | File |"
            echo "|----------|--------------|------|"
            echo "| Linux | x86_64 | \`${x86}.tar.gz\` |"
            echo "| Linux | aarch64 | \`${arm}.tar.gz\` |"
            echo "| Windows | x86_64 | \`${win}.zip\` |"
            echo "| macOS | aarch64 (Apple silicon) | \`${macarm}.tar.gz\` |"
            echo "| macOS | x86_64 (Intel) | \`${macx86}.tar.gz\` |"
            if ls artifacts/*.apk >/dev/null 2>&1; then
              echo "| Android | arm64-v8a, x86_64 | \`${base}-android.apk\` |"
            fi
            echo
            echo "A \`.sha256\` file is published next to each archive."
            echo
            echo "## Install"
            echo
            echo "### Linux"
            echo
            echo '```sh'
            echo "tar xzf ${x86}.tar.gz"
            echo "cd ${x86}"
            echo "sudo just install"
            echo '```'
            echo
            echo "Without \`just\`, copy \`aulos\` into your \`PATH\` and the"
            echo "files under \`resources/\` to the matching \`/usr/share\`."
            echo
            echo "### Windows"
            echo
            echo "Unzip \`${win}.zip\` and run \`aulos.exe\`."
            echo
            echo "### macOS"
            echo
            echo '```sh'
            echo "tar xzf ${macarm}.tar.gz"
            echo "./${macarm}/aulos"
            echo '```'
            echo
            echo "The binary is not code-signed; if Gatekeeper blocks it, run"
            echo "\`xattr -d com.apple.quarantine aulos\` once."
            if ls artifacts/*.apk >/dev/null 2>&1; then
              echo
              echo "### Android"
              echo
              echo "Install \`${base}-android.apk\` (Android 8.0+). Updates through"
              echo "[Obtainium](https://github.com/ImranR98/Obtainium): add this repository"
              echo "and it picks the single APK of each release. The package id is"
              echo "\`io.github.m0rf30.aulos\`; the signing certificate is listed in the README."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: aulos ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*.apk
            artifacts/*.apk.sha256
          generate_release_notes: false
