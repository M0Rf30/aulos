name: Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '**.toml'
      - '**.yml'
      - '**.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '**.toml'
      - '**.yml'
      - '**.yaml'
  workflow_dispatch:

jobs:
  actionlint:
    name: GitHub Actions Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  yamllint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install --user yamllint

      - name: Run yamllint
        run: |
          find . \( -path ./.git -o -path ./target \) -prune -o \
            \( -name "*.yml" -o -name "*.yaml" \) -print0 | \
            xargs -0 yamllint -c .yamllint.yml

  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate JSON files
        run: |
          echo "Validating renovate.json..."
          python3 -m json.tool .github/renovate.json > /dev/null
          echo "✓ renovate.json is valid"

      - name: Validate TOML files
        run: |
          echo "Validating TOML configuration files..."
          python3 -c "import tomllib; tomllib.load(open('deny.toml', 'rb'))"
          echo "✓ deny.toml is valid"

  validate-renovate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate renovate.json
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v1.1.0
        with:
          config_file_path: .github/renovate.json
          strict: false
