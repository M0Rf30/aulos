# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
# Aulos targets Linux (wayland/X11, zbus, ashpd, keyutils), Windows (MSVC)
# and macOS (Apple silicon and Intel), plus the browser build (wasm32, see
# .github/workflows/pages.yml).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste is a feature-complete proc-macro, pulled in transitively (image -> exr -> pulp)
    "RUSTSEC-2024-0436",
    # ttf-parser is unmaintained; pulled in transitively by the UI stack, no replacement we control
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    # clipboard-win / error-code (eframe -> arboard on Windows)
    "BSL-1.0",
    # webpki-root-certs (rustls-platform-verifier on wasm32): Mozilla CA bundle
    "CDLA-Permissive-2.0",
    # epaint_default_fonts ships egui's default fonts under these
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/M0Rf30/Symphonia",
    "https://github.com/M0Rf30/opensubsonic-rs",
    "https://github.com/M0Rf30/mpd_client",
]
