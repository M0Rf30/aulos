# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
# Aulos is Linux-only (wayland, zbus, ashpd, keyutils).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste is a feature-complete proc-macro, pulled in transitively by libcosmic/iced (image -> exr -> pulp)
    "RUSTSEC-2024-0436",
    # rustybuzz is unmaintained; pulled in transitively by libcosmic/iced (resvg -> usvg), no replacement we control
    "RUSTSEC-2026-0206",
    # ttf-parser is unmaintained; pulled in transitively by libcosmic/iced (cosmic-text -> fontdb), no replacement we control
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "GPL-3.0-only",
    "LGPL-3.0-or-later", # projectm (visualizer feature), dynamically linked
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

# pop-os crates living in subdirectories of their git repos have no license
# metadata cargo-deny can read; clarify them with the upstream repo licenses.
[[licenses.clarify]]
name = "libcosmic"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-config-derive"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-theme"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "iced_accessibility"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-settings-daemon"
expression = "MPL-2.0"
license-files = []

# window_clipboard (pop-os fork) is MIT
[[licenses.clarify]]
name = "dnd"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "mime"
version = "0.1.0"
expression = "MIT"
license-files = []

# apply ships License.md (Unlicense) but no manifest license field
[[licenses.clarify]]
name = "apply"
expression = "Unlicense"
license-files = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/M0Rf30/Symphonia",
    "https://github.com/M0Rf30/opensubsonic-rs",
    "https://github.com/pop-os/libcosmic",
    "https://github.com/pop-os/winit",
    "https://github.com/pop-os/window_clipboard",
    "https://github.com/pop-os/cosmic-protocols",
    "https://github.com/pop-os/freedesktop-icons",
    "https://github.com/pop-os/dbus-settings-bindings",
    "https://github.com/pop-os/smithay-clipboard",
    "https://github.com/pop-os/softbuffer",
    "https://github.com/wash2/accesskit",
    "https://github.com/jackpot51/rust-atomicwrites",
    "https://github.com/iced-rs/cryoglyph",
]
